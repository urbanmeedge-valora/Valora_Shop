<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELORA — Premium Store</title>
<style>
:root{--ivory:#f7f4ee;--cream:#eee8dc;--taupe:#c9bda9;--brown:#735f4b;--dark:#24211e;--white:#fff;--line:#ded6c9;--muted:#766f66}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--dark);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font:700 27px Georgia,serif;letter-spacing:5px}.tag{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:3px}.bag{border:1px solid var(--dark);background:transparent;padding:10px 15px;border-radius:30px}.bag span{background:var(--dark);color:white;border-radius:50%;padding:2px 7px;margin-left:6px}
.hero{max-width:1200px;margin:auto;padding:72px 22px 42px}.hero h1{font:500 clamp(42px,7vw,78px)/.95 Georgia,serif;margin:0 0 18px;max-width:760px}.hero p{max-width:600px;color:var(--muted);line-height:1.7;margin:0}.filters{max-width:1200px;margin:auto;padding:0 22px 24px;display:flex;gap:9px;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:25px;padding:9px 17px}.chip.active,.chip:hover{background:var(--dark);color:white;border-color:var(--dark)}
.grid{max-width:1200px;margin:auto;padding:0 22px 70px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.card-art{height:330px;background:var(--cream);position:relative;overflow:hidden}.card-art img{width:100%;height:100%;object-fit:cover;display:block}.noimg{height:100%;display:grid;place-items:center;color:var(--muted);font:24px Georgia,serif}.card-body{padding:16px}.card-name{font:600 18px Georgia,serif;margin:0 0 7px}.card-desc{font-size:13px;color:var(--muted);line-height:1.5;min-height:39px}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;gap:8px}.card-price{font-weight:700;font-size:17px}.card-mrp{text-decoration:line-through;color:#999;font-size:13px;margin-right:6px}.btn-add{background:var(--dark);color:white;border:0;border-radius:25px;padding:10px 15px}.status{text-align:center;padding:50px;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.35)}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(500px,100%);background:var(--ivory);padding:24px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.close{border:0;background:none;font-size:25px}.cart-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.cart-item img{width:72px;height:88px;object-fit:cover;background:var(--cream);border-radius:10px}.cart-info{flex:1}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{width:27px;height:27px;border:1px solid var(--line);background:white;border-radius:50%}.checkout{margin-top:22px}.checkout h3{font:22px Georgia,serif}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);background:white;border-radius:10px;outline:none}.field textarea{min-height:75px;resize:vertical}.pay{display:flex;gap:8px}.pay label{flex:1;border:1px solid var(--line);padding:11px;border-radius:10px;background:white;font-size:13px}.pay input{margin-right:5px}.total{display:flex;justify-content:space-between;font-weight:700;font-size:19px;padding:16px 0}.place{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brown);color:white;font-weight:700}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:9px}
footer{border-top:1px solid var(--line);padding:35px 22px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 18px;border-radius:30px;z-index:100;display:none}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{padding:14px 16px}.logo{font-size:23px}.hero{padding:50px 16px 30px}.filters,.grid{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr 1fr;gap:12px}.card-art{height:235px}.card-body{padding:12px}.card-name{font-size:16px}.card-desc{font-size:12px}.btn-add{padding:8px 11px;font-size:12px}.card-mrp{display:block;margin:0 0 3px}}
</style>
</head>
<body>
<header><div class="nav"><div><div class="logo">VELORA</div><div class="tag">CURATED • REFINED • MODERN</div></div><button class="bag" id="bagBtn">Bag <span id="bagCount">0</span></button></div></header>
<section class="hero"><h1>Refined pieces for everyday living.</h1><p>Discover thoughtfully selected fashion, accessories and lifestyle essentials, curated for a modern wardrobe.</p></section>
<div class="filters" id="filterRow"></div>
<main id="productGrid" class="grid"><div class="status">Loading products…</div></main>
<footer>© 2026 VELORA · Curated with care</footer>
<div class="drawer" id="drawer"><div class="panel"><div class="panel-head"><h2 style="font:26px Georgia,serif;margin:0">Your Bag</h2><button class="close" id="closeBtn">×</button></div><div id="cartList"></div><div id="checkoutBox"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const CONFIG={
 sheetWebAppUrl:'https://script.google.com/macros/s/AKfycbyvqf0e-s4MQqAXSVQw_X3xL6oalsZHSuLWMpbzP39pW7rOQnf67sSZxtRQrq88sqaK/exec',
 currency:'₹'
};
let products=[];let cart=[];
const grid=document.getElementById('productGrid'),filterRow=document.getElementById('filterRow');
const money=n=>CONFIG.currency+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function imageUrl(v){if(!v)return '';v=String(v).trim();if(v.includes('i.ibb.co/'))return v;if(v.includes('ibb.co/'))return '';return v}
function normalize(p,i){return {id:String(p.SKU||i),sku:String(p.SKU||''),name:String(p['Product Name']||'Product'),category:String(p.Category||'Other'),price:Number(p['Store Selling Price (₹)']||p['Store Selling Price']||0),mrp:Number(p['MRP (₹)']||p.MRP||0),desc:String(p['Short Description']||p.Discription||''),image:imageUrl(p['Image 1']||p['image 1']||'')};}
function renderFilters(){filterRow.innerHTML='';const cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))];cats.forEach((cat,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' active':'');b.textContent=cat;b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderProducts(cat)};filterRow.appendChild(b)})}
function renderProducts(filter='All'){grid.innerHTML='';const list=filter==='All'?products:products.filter(p=>p.category===filter);if(!list.length){grid.innerHTML='<div class="status" style="grid-column:1/-1">No products found.</div>';return}list.forEach(p=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="card-art">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<div class="noimg" style="${p.image?'display:none':''}">VELORA</div></div><div class="card-body"><h3 class="card-name">${esc(p.name)}</h3><p class="card-desc">${esc(p.desc)}</p><div class="card-foot"><div>${p.mrp>p.price?`<span class="card-mrp">${money(p.mrp)}</span>`:''}<span class="card-price">${money(p.price)}</span></div><button class="btn-add">Add</button></div></div>`;card.querySelector('.btn-add').onclick=()=>addToCart(p);grid.appendChild(card)})}
function addToCart(p){const x=cart.find(i=>i.id===p.id);if(x)x.qty++;else cart.push({...p,qty:1});updateCart();toast('Added to your bag');openDrawer()}
function updateCart(){document.getElementById('bagCount').textContent=cart.reduce((s,x)=>s+x.qty,0);renderCart()}
function renderCart(){const list=document.getElementById('cartList'),box=document.getElementById('checkoutBox');if(!cart.length){list.innerHTML='<div class="status">Your bag is empty.</div>';box.innerHTML='';return}list.innerHTML=cart.map((p,i)=>`<div class="cart-item"><img src="${esc(p.image)}" onerror="this.style.visibility='hidden'"><div class="cart-info"><b>${esc(p.name)}</b><div style="color:var(--muted);margin-top:5px">${money(p.price)}</div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${p.qty}</span><button onclick="changeQty(${i},1)">+</button><button style="margin-left:auto;border:0;background:none;color:#8a3b30" onclick="removeItem(${i})">Remove</button></div></div></div>`).join('');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);box.innerHTML=`<div class="checkout"><h3>Checkout</h3><div class="field"><label>Full name</label><input id="cName" required></div><div class="field"><label>Phone</label><input id="cPhone" required inputmode="tel"></div><div class="field"><label>Address</label><textarea id="cAddress" required></textarea></div><div class="field"><label>City</label><input id="cCity" required></div><div class="field"><label>PIN code</label><input id="cPin" required inputmode="numeric"></div><div class="field"><label>Payment</label><div class="pay"><label><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="pay" value="Online Payment"> Online Payment</label></div></div><div class="field"><label>Note (optional)</label><textarea id="cNote"></textarea></div><div class="total"><span>Total</span><span>${money(total)}</span></div><button class="place" id="placeBtn">Place Order</button><div class="notice">Your order details are sent securely to the store for processing.</div></div>`;document.getElementById('placeBtn').onclick=placeOrder}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart()}function removeItem(i){cart.splice(i,1);updateCart()}
function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}document.getElementById('bagBtn').onclick=openDrawer;document.getElementById('closeBtn').onclick=closeDrawer;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function loadProducts(){return new Promise((resolve,reject)=>{const cb='veloraProducts_'+Date.now();const s=document.createElement('script');window[cb]=data=>{delete window[cb];s.remove();resolve(data)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('Could not load products'))};s.src=CONFIG.sheetWebAppUrl+'?callback='+encodeURIComponent(cb);document.body.appendChild(s)})}
async function start(){try{const data=await loadProducts();products=(Array.isArray(data)?data:[]).map(normalize);renderFilters();renderProducts()}catch(e){grid.innerHTML='<div class="status" style="grid-column:1/-1">Products could not be loaded. Please check the Google Apps Script Web App.</div>';console.error(e)}}
async function placeOrder(){const name=document.getElementById('cName').value.trim(),phone=document.getElementById('cPhone').value.trim(),address=document.getElementById('cAddress').value.trim(),city=document.getElementById('cCity').value.trim(),pincode=document.getElementById('cPin').value.trim(),note=document.getElementById('cNote').value.trim(),payment=document.querySelector('input[name="pay"]:checked').value;if(!name||!phone||!address||!city||!pincode){toast('Please fill all required details');return}const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const order={action:'order',orderId:'VEL-'+Date.now(),name,phone,address,city,pincode,note,payment,total,items:cart.map(x=>({sku:x.sku,name:x.name,qty:x.qty,price:x.price}))};const btn=document.getElementById('placeBtn');btn.disabled=true;btn.textContent='Sending…';try{await fetch(CONFIG.sheetWebAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(order)});cart=[];updateCart();closeDrawer();toast('Order sent successfully');}catch(e){btn.disabled=false;btn.textContent='Place Order';toast('Could not send order. Please try again');console.error(e)}}
start();
</script>
</body></html>
